name: Viewer Release

on:
  push:
    branches:
      - master
    tags:
      - 'viewer-v*'

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev gettext libavcodec-dev libavutil-dev libfltk1.3-dev \
            libgmp-dev libgnutls28-dev libgtest-dev libjpeg-turbo8-dev \
            libpixman-1-dev libswscale-dev nettle-dev \
            libx11-dev libxdamage-dev libxext-dev libxfixes-dev \
            libxrandr-dev libxtst-dev zlib1g-dev
      - name: Configure
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_JAVA=OFF \
            -DBUILD_VIEWER=ON \
            -DENABLE_GNUTLS=ON \
            -DENABLE_H264=ON \
            -DENABLE_NETTLE=ON \
            -DENABLE_NLS=ON \
            -DENABLE_PAM=OFF \
            -DENABLE_PWQUALITY=OFF \
            -DENABLE_SELINUX=OFF \
            -DENABLE_SYSTEMD=OFF \
            -DENABLE_WAYLAND=OFF \
            -S . -B build
      - name: Build and test Viewer
        run: |
          cmake --build build --target vncviewer viewerparameters translations desktop appstream --parallel
          ctest --test-dir build/tests/unit -R ViewerParametersTest --output-on-failure
      - name: Package Viewer
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^set(VERSION \([^)]*\)).*/\1/p' CMakeLists.txt)"
          package="tigervnc-viewer"
          architecture="$(dpkg --print-architecture)"
          root="dist/debian/${package}"
          output="TigerVNC-Viewer-Ubuntu-24.04-${architecture}-${version}.deb"

          install -Dm755 build/vncviewer/vncviewer "${root}/usr/bin/vncviewer"
          install -Dm644 vncviewer/vncviewer.man "${root}/usr/share/man/man1/vncviewer.1"
          install -Dm644 build/vncviewer/vncviewer.desktop \
            "${root}/usr/share/applications/vncviewer.desktop"
          install -Dm644 vncviewer/org.tigervnc.connection.xml \
            "${root}/usr/share/mime/packages/org.tigervnc.connection.xml"
          install -Dm644 build/vncviewer/org.tigervnc.vncviewer.metainfo.xml \
            "${root}/usr/share/metainfo/org.tigervnc.vncviewer.metainfo.xml"
          install -Dm644 media/icons/tigervnc.svg \
            "${root}/usr/share/icons/hicolor/scalable/apps/tigervnc.svg"
          for size in 16 22 24 32 48 64 128; do
            install -Dm644 "media/icons/tigervnc_${size}.png" \
              "${root}/usr/share/icons/hicolor/${size}x${size}/apps/tigervnc.png"
          done
          while IFS= read -r lang; do
            install -Dm644 "build/po/${lang}.mo" \
              "${root}/usr/share/locale/${lang}/LC_MESSAGES/tigervnc.mo"
          done < po/LINGUAS
          install -Dm644 LICENCE.TXT \
            "${root}/usr/share/doc/${package}/copyright"
          install -Dm644 doc/ssh-tunnel.md \
            "${root}/usr/share/doc/${package}/ssh-tunnel.md"
          gzip -9n "${root}/usr/share/man/man1/vncviewer.1"

          install -d "${root}/DEBIAN"
          cat > dist/debian/control <<EOF
          Source: ${package}
          Section: x11
          Priority: optional
          Maintainer: Wave7t <noreply@github.com>
          Standards-Version: 4.6.2
          Homepage: https://github.com/Wave7t/tigervnc-nics

          Package: ${package}
          Architecture: any
          Description: TigerVNC Viewer with portable SSH tunnel profiles
           A high-performance VNC client with cross-platform SSH tunnel
           connection profiles.
          EOF
          cat > "${root}/DEBIAN/control" <<EOF
          Package: ${package}
          Version: ${version}
          Section: x11
          Priority: optional
          Architecture: ${architecture}
          Maintainer: Wave7t <noreply@github.com>
          Description: TigerVNC Viewer with portable SSH tunnel profiles
           A high-performance VNC client with cross-platform SSH tunnel
           connection profiles.
          EOF

          depends="$(
            cd dist
            dpkg-shlibdeps \
              -O -e"debian/${package}/usr/bin/vncviewer" |
              sed -n 's/^shlibs:Depends=//p'
          )"
          test -n "$depends"
          installed_size="$(du -sk "${root}/usr" | cut -f1)"
          cat > "${root}/DEBIAN/control" <<EOF
          Package: ${package}
          Version: ${version}
          Section: x11
          Priority: optional
          Architecture: ${architecture}
          Maintainer: Wave7t <noreply@github.com>
          Installed-Size: ${installed_size}
          Depends: ${depends}
          Recommends: openssh-client
          Homepage: https://github.com/Wave7t/tigervnc-nics
          Description: TigerVNC Viewer with portable SSH tunnel profiles
           A high-performance VNC client with cross-platform SSH tunnel
           connection profiles.
          EOF

          dpkg-deb --root-owner-group --build "$root" "$output"
          dpkg-deb --info "$output"
          test "$(dpkg-deb --field "$output" Package)" = "$package"
          test "$(dpkg-deb --field "$output" Architecture)" = "$architecture"
          sudo apt-get install -y "./${output}"
          test "$(dpkg-query -W -f='${Status}' "$package")" = \
            "install ok installed"
      - uses: actions/upload-artifact@v7
        with:
          name: viewer-linux
          path: TigerVNC-Viewer-Ubuntu-24.04-*.deb
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          update: true
      - name: Install dependencies
        run: |
          pacman --sync --noconfirm --needed \
            make mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake
          pacman --sync --noconfirm --needed \
            mingw-w64-x86_64-fltk1.3 mingw-w64-x86_64-gmp \
            mingw-w64-x86_64-gnutls mingw-w64-x86_64-gtest \
            mingw-w64-x86_64-libjpeg-turbo mingw-w64-x86_64-nettle \
            mingw-w64-x86_64-pixman
      - name: Configure
        run: |
          cmake \
            -G "MSYS Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_JAVA=OFF \
            -DBUILD_VIEWER=ON \
            -DENABLE_GNUTLS=ON \
            -DENABLE_H264=ON \
            -DENABLE_NETTLE=ON \
            -DENABLE_NLS=ON \
            -S . -B build
      - name: Build and test Viewer
        run: |
          cmake --build build --target viewerparameters
          ctest --test-dir build/tests/unit -R ViewerParametersTest --output-on-failure
      - name: Build Viewer installer
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          cmake --build build --target translations installer
      - name: Package Viewer
        run: |
          set -euo pipefail
          version="$(sed -n 's/^set(VERSION \([^)]*\)).*/\1/p' CMakeLists.txt)"
          source="$(find build/release -maxdepth 1 -name 'tigervnc*.exe' ! -name '*winvnc*' -print -quit)"
          test -n "$source"
          cp "$source" "TigerVNC-Viewer-Windows-x86_64-${version}.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: viewer-windows
          path: TigerVNC-Viewer-Windows-*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - name: Require signing credentials for a release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test -n "$MACOS_CERTIFICATE_P12"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$MACOS_SIGN_IDENTITY"
          test -n "$MACOS_NOTARY_APPLE_ID"
          test -n "$MACOS_NOTARY_TEAM_ID"
          test -n "$MACOS_NOTARY_PASSWORD"
      - name: Import Apple signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          certificate_path="$RUNNER_TEMP/tigervnc-signing.p12"
          keychain_path="$RUNNER_TEMP/tigervnc-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode \
            --output "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | \
            grep -F "$MACOS_SIGN_IDENTITY"
      - name: Install dependencies
        run: |
          tap_dir="$(brew --repository)/Library/Taps/aws/homebrew-tap"
          if [[ -d "$tap_dir" ]]; then
            brew untap aws/tap
          fi
          brew install fltk@1.3 gettext gmp gnutls googletest nettle pixman ffmpeg
      - name: Configure
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix fltk@1.3)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DBUILD_JAVA=OFF \
            -DBUILD_VIEWER=ON \
            -DBUILD_WINVNC=0 \
            -DENABLE_GNUTLS=ON \
            -DENABLE_H264=ON \
            -DENABLE_NETTLE=ON \
            -DENABLE_NLS=ON \
            -S . -B build
      - name: Build and test Viewer
        run: |
          cmake --build build --target vncviewer viewerparameters translations --parallel
          ctest --test-dir build/tests/unit -R ViewerParametersTest --output-on-failure
          cmake --build build --target dmg --parallel
      - name: Package Viewer
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^set(VERSION \([^)]*\)).*/\1/p' CMakeLists.txt)"
          test "$(uname -m)" = "arm64"
          file build/vncviewer/vncviewer | grep -q 'arm64'
          cp "build/release/TigerVNC-${version}.dmg" \
            "TigerVNC-Viewer-macOS-arm64-${version}.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: viewer-macos
          path: TigerVNC-Viewer-macOS-arm64-*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create checksums and release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#viewer-v}"
          (cd release-artifacts && sha256sum * > SHA256SUMS.txt)
          cat > release-notes.md <<'EOF'
          This Viewer-only prerelease fixes macOS packaging and installation.

          Highlights:
          - The macOS app now bundles all non-system runtime libraries.
          - The DMG includes the standard Applications drag target.
          - macOS releases are Developer ID signed, notarized, and stapled.
          - Tagged builds stop before publication if signing credentials are missing.

          Packages:
          - Ubuntu 24.04 (amd64): install the `.deb` with `apt` or `dpkg`.
          - macOS Apple silicon (arm64): open the `.dmg` directly.
          - Windows (x86_64): run the `.exe` installer directly.
          EOF
          printf '\nVersion: %s\n' "$version" >> release-notes.md
      - name: Publish GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --verify-tag \
            --prerelease \
            --title "TigerVNC Viewer ${GITHUB_REF_NAME#viewer-v}" \
            --notes-file release-notes.md
